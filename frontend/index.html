<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный бюджет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Заголовок -->
    <h1>💰 Семейный бюджет</h1>

    <!-- Форма для добавления новой записи -->
    <div id="form-container">
        <h2>Добавить расход/доход</h2>
        <input type="date" id="date">
        <input type="text" id="desc" placeholder="На что потратили? (например, Стрижка)">
        <input type="number" id="amount" placeholder="Сумма в евро">
        <input type="text" id="category" placeholder="Категория (например, Личное)">
        <button onclick="addTransaction()">Добавить</button>
    </div>

    <!-- Место для списка транзакций -->
    <div id="transactions-container">
        <h2>Все транзакции</h2>
        <div id="transaction-list"></div>
        <h3 id="total">Итого: 0 €</h3>
    </div>

    <dialog id="edit-dialog">
        <h2>✏️ Редактировать транзакцию</h2>

        <form id="edit-form">

            <label for="edit-date">Дата</label>
            <input type="date" id="edit-date" required>

            <label for="edit-desc">Описание</label>
            <input type="text" id="edit-desc" required>

            <label for="edit-amount">Сумма (€)</label>
            <input type="number" id="edit-amount" step="0.01" required>

            <label for="edit-category">Категория</label>
            <input type="text" id="edit-category" required>

            <div class="dialog-buttons">
                <button type="button" id="cancel-edit">
                    Отмена
                </button>

                <button type="submit">
                    Сохранить
                </button>
            </div>
        </form>   
    </dialog>

    <script src="script.js"></script>
</body>
</html>
